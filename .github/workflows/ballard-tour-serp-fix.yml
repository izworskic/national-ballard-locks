name: Ballard Tour SERP Fix

on:
  push:
    branches:
      - agent/ballard-tour-serp-fix
    paths:
      - '.github/workflows/ballard-tour-serp-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-tour-serp-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tighten tour SERP metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='public/ballard-locks/tour/index.html';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('<title>Ballard Locks Self-Guided Tour Map | Live Stops & Walking Routes</title>','<title>Ballard Locks Tour Map: Live Self-Guided Walk</title>');
          s=s.replace('<meta name="description" content="Interactive Ballard Locks self-guided tour map with live salmon, lock, tide and water-level context. Choose a 20, 45 or 75 minute walking route through the Hiram M. Chittenden Locks and nearby Ballard highlights.">','<meta name="description" content="Explore the Ballard Locks with an interactive self-guided map, 20-, 45- and 75-minute routes, plus live salmon, lock and water-level context.">');
          fs.writeFileSync(p,s);
          NODE
      - name: Test
        run: npm test
      - name: Verify metadata lengths
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('public/ballard-locks/tour/index.html','utf8');
          const title=s.match(/<title>(.*?)<\/title>/)?.[1]||'';
          const desc=s.match(/<meta name="description" content="([^"]*)">/)?.[1]||'';
          console.log({title,titleLength:title.length,desc,descriptionLength:desc.length});
          if(title.length>60||desc.length>158) process.exit(1);
          NODE
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/tour/index.html
          git commit -m 'Tighten Ballard tour search metadata'
          git push
