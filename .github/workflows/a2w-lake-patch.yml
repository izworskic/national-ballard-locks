name: Patch Ballard A2W lake level

on:
  push:
    branches:
      - agent/a2w-lake-level

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use USACE Access to Water lake level feed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a2w-lake-level
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch API and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          api = Path('api/ballard-locks.js')
          s = api.read_text()
          s = s.replace(
          "const LEVEL = 'https://water.usace.army.mil/office/nws/data/lkw_lwsc_plot';\nconst CWMS_TSID = 'LWSC.Elev-Lake.Ave.1Hour.1Hour.IRIDIUM-REV';\nconst CWMS_BASES = [\n  'https://water.usace.army.mil/cwms-data/timeseries',\n  'https://cwms-data.usace.army.mil/cwms-data/timeseries',\n];",
          "const LEVEL_PAGE = 'https://water.usace.army.mil/overview/nws/locations/lwsc';\nconst LEVEL_FALLBACK = 'https://water.usace.army.mil/office/nws/data/lkw_lwsc_plot';\nconst A2W_LEVEL = 'https://water.usace.army.mil/cda/reporting/providers/nws/locations/lwsc';\nconst CWMS_TSID = 'LWSC.Elev-Lake.Ave.1Hour.1Hour.IRIDIUM-REV';"
          )

          parser = r'''function parseA2wLatest(data) {
  const locations = Array.isArray(data) ? data : [data];
  for (const location of locations) {
    const rows = Array.isArray(location?.timeseries) ? location.timeseries : [];
    const row = rows.find(x => x?.tsid === CWMS_TSID) || rows.find(x => x?.label === 'Elevation' && x?.unit === 'ft');
    if (!row) continue;
    if (row.latest_value == null || !String(row.latest_value).trim()) continue;
    const valueFt = Number(row.latest_value);
    const timeMs = Date.parse(String(row.latest_time || ''));
    if (!Number.isFinite(valueFt) || !Number.isFinite(timeMs)) continue;
    return {
      valueFt,
      observedAt:new Date(timeMs).toISOString(),
      delta24hr:Number.isFinite(Number(row.delta24hr)) ? Number(row.delta24hr) : null,
      tsid:row.tsid || CWMS_TSID,
    };
  }
  return null;
}

'''
          s, n = re.subn(r'function parseCwmsLatest\(data\) \{[\s\S]*?\n\}\n\n(?=async function lakeLevel\(\))', parser, s, count=1)
          assert n == 1, 'parser replacement failed'

          lake = r'''async function lakeLevel() {
  const errors = [];
  try {
    const data = await get(A2W_LEVEL, 'json', 8000, { accept:'application/json' });
    const latest = parseA2wLatest(data);
    if (!latest) throw new Error('Access to Water response contained no usable elevation value');
    if (latest.valueFt < 18 || latest.valueFt > 24) throw new Error(`USACE elevation outside expected range: ${latest.valueFt}`);
    const ageHours = Math.max(0, Math.round(((Date.now() - Date.parse(latest.observedAt)) / 3600000) * 10) / 10);
    if (ageHours > 72) throw new Error(`USACE elevation is stale by ${ageHours} hours`);
    return {
      ok:true,
      valueFt:latest.valueFt,
      observedAt:latest.observedAt,
      ageHours,
      delta24hr:latest.delta24hr,
      targetRangeFt:[20,22],
      provisional:true,
      source:'USACE Access to Water',
      tsid:latest.tsid,
      url:LEVEL_PAGE,
      dataUrl:A2W_LEVEL,
    };
  } catch (e) {
    errors.push(`Access to Water: ${e.message}`);
  }

  try {
    const page = text(await get(LEVEL_FALLBACK, 'text'));
    const match = page.match(/(?:LWSC|Lake Washington Ship Canal)[\s\S]{0,8000}?(2[01]\.\d{1,2})\s*(?:ft|feet)?/i) || page.match(/(2[01]\.\d{1,2})\s*(?:ft|feet)/i);
    if (!match) throw new Error('Current elevation not safely machine-readable');
    const valueFt = +match[1];
    if (valueFt < 18 || valueFt > 24) throw new Error('Elevation outside expected range');
    return { ok:true, valueFt, targetRangeFt:[20,22], provisional:true, source:'USACE Seattle Water Management', url:LEVEL_PAGE, note:'Access to Water API unavailable; using official Seattle Water Management page fallback.' };
  } catch(e) {
    errors.push(`legacy page: ${e.message}`);
    return { ok:false, targetRangeFt:[20,22], source:'USACE Seattle Water Management', error:errors.join('; '), url:LEVEL_PAGE };
  }
}

'''
          s, n = re.subn(r'async function lakeLevel\(\) \{[\s\S]*?\n\}\n\n(?=const plannedClosures)', lake, s, count=1)
          assert n == 1, 'lakeLevel replacement failed'
          s = s.replace('parseSpecies, parseCwmsLatest, pacificParts', 'parseSpecies, parseA2wLatest, pacificParts')
          api.write_text(s)

          tests = Path('tests/ballard-locks.test.js')
          t = tests.read_text()
          replacement = r'''test('USACE Access to Water parser selects the live LWSC elevation series', () => {
  const parsed = api.parseA2wLatest([{
    provider:'NWS',
    code:'LWSC',
    timeseries:[
      {tsid:'LWSC.Flow.Ave.~1Day.1Day.CENWS-COMPUTED-RAW',label:'Outflow',unit:'cfs',latest_time:'2026-09-08T07:00:00Z',latest_value:249.57},
      {tsid:'LWSC.Elev-Lake.Ave.1Hour.1Hour.IRIDIUM-REV',label:'Elevation',unit:'ft',latest_time:'2026-09-08T22:00:00Z',latest_value:20.25,delta24hr:-0.03},
    ],
  }]);
  assert.equal(parsed.valueFt, 20.25);
  assert.equal(parsed.observedAt, '2026-09-08T22:00:00.000Z');
  assert.equal(parsed.delta24hr, -0.03);
  assert.equal(parsed.tsid, 'LWSC.Elev-Lake.Ave.1Hour.1Hour.IRIDIUM-REV');
  assert.equal(api.parseA2wLatest([{timeseries:[{label:'Elevation',unit:'ft',latest_time:null,latest_value:null}]}]), null);
});
'''
          t, n = re.subn(r"test\('CWMS parser selects the newest usable elevation value',[\s\S]*?\n\}\);\n", replacement, t, count=1)
          assert n == 1, 'test replacement failed'
          tests.write_text(t)
          PY
      - name: Run tests
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ballard-locks.js tests/ballard-locks.test.js
          git commit -m "Use USACE Access to Water lake level feed"
          git push origin HEAD:agent/a2w-lake-level
