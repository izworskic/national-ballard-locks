name: Add Ballard AIS live status

on:
  push:
    branches:
      - agent/ballard-ais-live-status
    paths:
      - '.github/workflows/ballard-ais-live-status.yml'
      - 'scripts/add-ais-live-status.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-ais-live-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add AIS live status
        run: python scripts/add-ais-live-status.py
      - name: Verify Ballard package
        run: npm test
      - name: Commit status treatment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/tour/index.html tests/ballard-tour.test.js
          git commit -m 'Add live AIS auto-update status'
          git push
