name: Build live layers into Ballard tour map

on:
  push:
    branches:
      - agent/ballard-map-live-layers
    paths:
      - '.github/workflows/ballard-map-live-layers.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-map-live-layers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch tour map
        run: python scripts/patch-ballard-tour-live.py
      - name: Verify authoritative package
        run: npm test
      - name: Commit live map layers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/tour/index.html tests/ballard-tour.test.js
          git commit -m 'Put fish AIS and camera on Ballard tour map'
          git push
