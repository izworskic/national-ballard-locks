name: Build live layers into Ballard tour map

on:
  push:
    branches:
      - agent/ballard-map-live-layers
    paths:
      - '.github/workflows/ballard-map-live-layers.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-map-live-layers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put fish AIS and camera on the tour map
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/ballard-locks/tour/index.html')
          s = p.read_text()

          # Remove the marketing-style explainer block entirely.
          s, removed = re.subn(r'<aside class="quick-facts">.*?</aside>', '', s, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit('What this map adds block not found exactly once')
          s = s.replace('.intro{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:start}', '.intro{max-width:900px}', 1)

          # Add a compact live-data dock that physically sits inside the MapLibre map surface.
          css_anchor = '.map{position:absolute;inset:0}'
          css = '''.map-live-dock{position:absolute;right:12px;top:12px;z-index:6;width:min(410px,calc(100% - 24px));background:rgba(255,255,255,.97);border:1px solid #d2d0c8;border-radius:13px;box-shadow:0 10px 30px rgba(14,41,48,.22);overflow:hidden;font-family:Arial,sans-serif}.map-live-tabs{display:flex;align-items:center;gap:5px;padding:7px;background:#102f39}.map-live-tab,.map-live-toggle{border:0;border-radius:999px;padding:7px 9px;cursor:pointer;font:800 .65rem Arial,sans-serif}.map-live-tab{background:#244d56;color:#eaf5f4}.map-live-tab.is-on{background:#f3efe4;color:#173d46}.map-live-toggle{margin-left:auto;background:transparent;color:#bdd5d6}.map-live-dock.is-collapsed .map-live-body{display:none}.map-live-panel[hidden]{display:none}.map-live-panel{background:#fff}.map-live-frame{height:238px;background:#18343d}.map-live-frame iframe{width:100%;height:100%;border:0;display:block}.map-live-note{padding:8px 10px;color:#617579;font:600 .68rem/1.35 Arial,sans-serif;border-top:1px solid #e8e3da}.map-fish-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}.map-fish-row{padding:11px 9px;border-right:1px solid #ebe6dd}.map-fish-row:last-child{border-right:0}.map-fish-row strong{display:block;color:#173f49;font:800 .72rem Arial,sans-serif}.map-fish-row b{display:block;color:#0d6570;font:800 1.15rem/1.1 Arial,sans-serif;margin:4px 0}.map-fish-row small{display:block;color:#6c7b7e;font:600 .62rem/1.3 Arial,sans-serif}.map-live-title{padding:9px 10px;border-bottom:1px solid #e8e3da;color:#173f49;font:800 .7rem Arial,sans-serif}.live-map-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#45b886;margin-right:6px;box-shadow:0 0 0 3px rgba(69,184,134,.14)}'''
          if css_anchor not in s:
              raise SystemExit('map CSS anchor missing')
          s = s.replace(css_anchor, css_anchor + css, 1)

          # Mobile treatment: the dock remains on-map but stops covering most of the walking map.
          mobile_anchor = '@media(max-width:620px){'
          mobile_css = '@media(max-width:620px){.map-live-dock{top:auto;bottom:42px;right:8px;width:calc(100% - 16px)}.map-live-frame{height:205px}.map-live-tabs{overflow-x:auto}.map-live-tab{white-space:nowrap}.map-fish-row{padding:9px 7px}'
          if mobile_anchor not in s:
              raise SystemExit('mobile CSS anchor missing')
          s = s.replace(mobile_anchor, mobile_css, 1)

          map_anchor = '<div class="map-layout"><div class="map-wrap"><div id="tour-map" class="map" role="application" aria-label="Interactive map of Ballard Locks tour stops"></div>'
          dock = '''<div class="map-layout"><div class="map-wrap"><div id="tour-map" class="map" role="application" aria-label="Interactive map of Ballard Locks tour stops"></div><div class="map-live-dock" id="map-live-dock" aria-label="Live Ballard data on the tour map"><div class="map-live-tabs"><button class="map-live-tab" data-live-panel="fish" type="button">Fish</button><button class="map-live-tab is-on" data-live-panel="ais" type="button"><span class="live-map-dot"></span>AIS ships</button><button class="map-live-tab" data-live-panel="camera" type="button">Camera</button><button class="map-live-toggle" id="map-live-toggle" type="button" aria-expanded="true">Hide</button></div><div class="map-live-body"><section class="map-live-panel" id="map-live-panel-fish" hidden><div class="map-live-title">Latest published WDFW Ballard Locks counts</div><div class="map-fish-grid" id="map-fish-grid"><div class="map-live-note">Loading Sockeye, Chinook and Coho counts…</div></div><div class="map-live-note" id="map-fish-note">Counts are preliminary; the source date is shown.</div></section><section class="map-live-panel" id="map-live-panel-ais"><div class="map-live-frame"><iframe id="tour-ais-map" title="Live AIS vessel traffic at Ballard Locks" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen src="https://embed.myshiptracking.com/embed?myst&amp;zoom=15&amp;lat=47.66556&amp;lng=-122.39722&amp;show_names=1&amp;scroll_wheel=0&amp;show_menu=0&amp;map_style=simple&amp;ref=https%3A%2F%2Fchrisizworski.com%2Fballard-locks%2Ftour%2F"></iframe></div><div class="map-live-note">Live AIS around Salmon Bay and the lock approaches. Small recreational boats without AIS will not appear.</div></section><section class="map-live-panel" id="map-live-panel-camera" hidden><div class="map-live-frame"><iframe title="Live Ballard Ship Canal Camera 3" loading="lazy" allowfullscreen src="https://g1.ipcamlive.com/player/player.php?alias=5ababb8154afe"></iframe></div><div class="map-live-note">Live Salmon Bay Marine Center Camera #3, upstream of the Ballard Locks.</div></section></div></div>'''
          if map_anchor not in s:
              raise SystemExit('map HTML anchor missing')
          s = s.replace(map_anchor, dock, 1)

          # Put all three fish species into the fish-ladder popup rather than only the busiest species.
          old_fish = "if(s.live==='fish'){const fish=liveData.fish?.species||[];const best=[...fish].sort((a,b)=>(b.latest?.daily||0)-(a.latest?.daily||0))[0];return best?`${best.species}: ${best.latest.daily.toLocaleString()} counted on ${best.latest.date} · ${best.latest.total.toLocaleString()} running total`:'Current WDFW fish count unavailable.'}"
          new_fish = "if(s.live==='fish'){const fish=liveData.fish?.species||[];if(!fish.length)return 'Current WDFW fish count unavailable.';const order=['Sockeye','Chinook','Coho'];const rows=order.map(name=>fish.find(x=>x.species===name)).filter(Boolean);const date=rows[0]?.latest?.date||'latest';return `${rows.map(x=>`${x.species} ${Number(x.latest?.daily||0).toLocaleString()}`).join(' · ')} · WDFW ${date}`}"
          if old_fish not in s:
              raise SystemExit('fish popup branch not found')
          s = s.replace(old_fish, new_fish, 1)

          # Add live dock rendering and switching behavior after the HTML escape helper.
          helper_pattern = r'(function escapeHtml\(s\)\{[^\n]+\}\n)'
          helper_js = r'''function renderMapFish(){const el=$('map-fish-grid');if(!el)return;const fish=liveData?.fish?.species||[];const order=['Sockeye','Chinook','Coho'];const rows=order.map(name=>fish.find(x=>x.species===name)).filter(Boolean);if(!rows.length){el.innerHTML='<div class="map-live-note">Latest fish counts are temporarily unavailable.</div>';return}el.innerHTML=rows.map(x=>`<div class="map-fish-row"><strong>${escapeHtml(x.species)}</strong><b>${Number(x.latest?.daily||0).toLocaleString()}</b><small>${escapeHtml(x.latest?.date||'—')} · ${Number(x.latest?.total||0).toLocaleString()} total</small></div>`).join('');const dates=[...new Set(rows.map(x=>x.latest?.date).filter(Boolean))];$('map-fish-note').textContent=`WDFW${dates.length?` · ${dates.join(', ')}`:''} · latest published daily counts, not a live fish counter.`}
function setLivePanel(kind){const dock=$('map-live-dock');dock?.classList.remove('is-collapsed');const toggle=$('map-live-toggle');if(toggle){toggle.textContent='Hide';toggle.setAttribute('aria-expanded','true')}document.querySelectorAll('.map-live-tab').forEach(b=>b.classList.toggle('is-on',b.dataset.livePanel===kind));for(const name of ['fish','ais','camera']){const panel=$(`map-live-panel-${name}`);if(panel)panel.hidden=name!==kind}gtag?.('event','tour_live_layer',{layer:kind})}
'''
          s, n = re.subn(helper_pattern, lambda m: m.group(1) + helper_js, s, count=1)
          if n != 1:
              raise SystemExit('escape helper insertion point missing')

          # Render fish immediately when the API lands.
          if 'liveData=await r.json();' not in s:
              raise SystemExit('liveData assignment missing')
          s = s.replace('liveData=await r.json();', 'liveData=await r.json();renderMapFish();', 1)

          # Wire controls before the existing route listeners.
          listener_anchor = "document.querySelectorAll('.route-btn').forEach"
          live_listeners = "document.querySelectorAll('.map-live-tab').forEach(b=>b.addEventListener('click',()=>setLivePanel(b.dataset.livePanel)));$('map-live-toggle').addEventListener('click',()=>{const dock=$('map-live-dock');const collapsed=dock.classList.toggle('is-collapsed');$('map-live-toggle').textContent=collapsed?'Show':'Hide';$('map-live-toggle').setAttribute('aria-expanded',String(!collapsed))});\n"
          if listener_anchor not in s:
              raise SystemExit('route listener anchor missing')
          s = s.replace(listener_anchor, live_listeners + listener_anchor, 1)

          # No stale explainer remains.
          if 'What this map adds' in s:
              raise SystemExit('What this map adds still present')

          p.write_text(s)

          # Strengthen the permanent tour contract.
          t = Path('tests/ballard-tour.test.js')
          ts = t.read_text()
          block = '''\ntest('tour puts fish AIS and the live camera directly on the map',()=>{\n  assert.ok(!tour.includes('What this map adds'));\n  assert.ok(tour.includes('id="map-live-dock"'));\n  assert.ok(tour.includes('data-live-panel="fish"'));\n  assert.ok(tour.includes('data-live-panel="ais"'));\n  assert.ok(tour.includes('data-live-panel="camera"'));\n  assert.ok(tour.includes('https://embed.myshiptracking.com/embed?myst'));\n  assert.ok(tour.includes('https://g1.ipcamlive.com/player/player.php?alias=5ababb8154afe'));\n  for(const species of ['Sockeye','Chinook','Coho']) assert.ok(tour.includes(species));\n  assert.ok(tour.includes('latest published daily counts, not a live fish counter'));\n});\n'''
          if "tour puts fish AIS and the live camera directly on the map" not in ts:
              t.write_text(ts + block)
          PY
      - name: Verify authoritative Ballard package
        run: npm test
      - name: Commit live map layers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/tour/index.html tests/ballard-tour.test.js
          git commit -m 'Put fish AIS and camera on Ballard tour map'
          git push
