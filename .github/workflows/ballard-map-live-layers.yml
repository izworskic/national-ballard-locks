name: Finalize live layers on Ballard tour map

on:
  push:
    branches:
      - agent/ballard-map-live-layers
    paths:
      - '.github/workflows/ballard-map-live-layers.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-map-live-layers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix live-layer listener placement
        run: python scripts/fix-ballard-live-listeners.py
      - name: Verify authoritative package
        run: npm test
      - name: Commit final live map implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/tour/index.html tests/ballard-tour.test.js
          git commit -m 'Finalize Ballard tour live map layers'
          git push
