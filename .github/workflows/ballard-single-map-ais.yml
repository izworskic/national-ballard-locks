name: Build Ballard single-map AIS

on:
  push:
    branches:
      - agent/ballard-single-map-ais
    paths:
      - '.github/workflows/ballard-single-map-ais.yml'
      - 'scripts/rebuild-ballard-single-map.py'
      - 'api/ballard-ais.js'
      - 'tests/ballard-ais.test.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-single-map-ais
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild tour as one map engine
        run: python scripts/rebuild-ballard-single-map.py
      - name: Verify Ballard package
        run: npm test
      - name: Commit product rebuild
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/tour/index.html tests/ballard-tour.test.js
          git commit -m 'Replace split AIS overlay with single live map'
          git push
