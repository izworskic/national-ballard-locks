name: Inspect SBMC Cam 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dock cams source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error 'https://www.sbmc.com/dock-cams/' -o /tmp/sbmc.html
          echo '--- likely video/embed refs ---'
          grep -Eio 'https?://[^"'"'"' <>)]+|src=["'"'"'][^"'"'"']+|href=["'"'"'][^"'"'"']+' /tmp/sbmc.html | grep -Ei 'cam|video|stream|embed|iframe|youtube|vimeo|m3u8|rtsp|hls|dock' | head -200 || true
          echo '--- camera / map context ---'
          grep -Ein -C 3 'cam.?3|camera.?3|dock.?cam|ship.?canal|video|iframe|m3u8' /tmp/sbmc.html | head -300 || true
