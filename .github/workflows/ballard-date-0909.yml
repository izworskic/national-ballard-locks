name: Align Ballard modification date

on:
  push:
    branches:
      - agent/ballard-date-0909
    paths:
      - '.github/workflows/ballard-date-0909.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-date-0909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align Ballard landing metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/ballard-locks/index.html')
          s = p.read_text()
          old = '"dateModified":"2026-09-08"'
          new = '"dateModified":"2026-09-09"'
          if old not in s:
              raise SystemExit('old dateModified not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        run: npm test
      - name: Commit metadata alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/index.html
          git commit -m 'Align Ballard modification date'
          git push
