name: Patch Ballard single popup

on:
  push:
    branches:
      - agent/ballard-single-popup
    paths:
      - '.github/workflows/patch-single-popup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-single-popup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch popup lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/ballard-locks/tour/index.html')
          s = p.read_text()
          old_decl = "let current='essential',map,markers=new Map(),liveData=null,userMarker=null;"
          new_decl = "let current='essential',map,markers=new Map(),liveData=null,userMarker=null,activePopup=null;"
          if old_decl not in s:
              raise SystemExit('popup state declaration anchor not found')
          s = s.replace(old_decl, new_decl, 1)
          old_marker = "const marker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([s.lng,s.lat]).setPopup(new maplibregl.Popup({offset:25,maxWidth:'320px'}).setHTML(popupHtml(s))).addTo(map);markers.set(s.id,marker)"
          new_marker = "const popup=new maplibregl.Popup({offset:25,maxWidth:'320px'}).setHTML(popupHtml(s));popup.on('open',()=>{if(activePopup&&activePopup!==popup)activePopup.remove();activePopup=popup});popup.on('close',()=>{if(activePopup===popup)activePopup=null});const marker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([s.lng,s.lat]).setPopup(popup).addTo(map);markers.set(s.id,marker)"
          if old_marker not in s:
              raise SystemExit('marker popup anchor not found')
          s = s.replace(old_marker, new_marker, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: npm test
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/tour/index.html
          git commit -m 'Keep only one Ballard tour popup open'
          git push
