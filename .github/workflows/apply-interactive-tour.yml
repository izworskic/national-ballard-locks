name: Apply Ballard Interactive Tour

on:
  push:
    branches:
      - agent/ballard-interactive-tour

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ballard-interactive-tour
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inject tour discovery into main Ballard page
        run: node scripts/add-interactive-tour.mjs
      - name: Run Ballard tests
        run: npm test
      - name: Commit generated main-page discovery
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/ballard-locks/index.html; then
            echo 'No generated change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ballard-locks/index.html
          git commit -m 'Link Ballard interactive tour from live page'
          git push
